<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Canvas Local</title><link rel="stylesheet" href="options.css"></head>
<body><main><p class="brand">CANVAS LOCAL</p><h1>Your coursework.<br>Your own pace.</h1><p>Connect Canvas to your private desktop feed. Exact deadlines, personal overrides, and no cloud task account.</p>
<form id="connect"><label for="origin">Your Canvas website</label><input id="origin" type="url" placeholder="https://school.instructure.com" required><button>Connect Canvas</button></form>
<button id="sync" class="secondary">Sync now</button><p id="status" role="status">Checking local connection…</p><p class="hint">Already-open Canvas pages need one reload after connecting. Open “My workspace” in Canvas’s navigation.</p></main><script src="options.js"></script></body></html>
